<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Rôles des clubs</title>
</head>
<body>

<h1>Liste des rôles des clubs</h1>

<a th:href="@{/roles-club/ajouter}">Attribuer un rôle</a>

<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>Rôle</th>
        <th>Date d'attribution</th>
        <th>Actions</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="role : ${roles}">
        <td th:text="${role.id}"></td>
        <td th:text="${role.role}"></td>
        <td th:text="${role.dateAttribution}"></td>
        <td>
            <a th:href="@{/roles-club/supprimer/{id}(id=${role.id})}">
                Supprimer
            </a>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
