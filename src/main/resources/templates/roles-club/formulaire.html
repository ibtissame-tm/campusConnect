<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Attribuer un rôle</title>
</head>
<body>

<h1>Attribuer un rôle à un étudiant</h1>

<form th:action="@{/roles-club/ajouter}"
      th:object="${roleClub}"
      method="post">

    <label for="role">Choisir le rôle :</label>

    <select id="role" th:field="*{role}">
        <option value="RESPONSABLE_MEDIA">Responsable média</option>
        <option value="RESPONSABLE_ADHESION">Responsable adhésion</option>
    </select>

    <br><br>

    <button type="submit">Attribuer</button>

</form>

<a th:href="@{/roles-club}">Retour à la liste</a>

</body>
</html>
