<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ajouter un abonnement</title>
</head>
<body>

<h1>Ajouter un abonnement</h1>

<form th:action="@{/abonnements/ajouter}"
      th:object="${abonnement}"
      method="post">

    <button type="submit">S'abonner</button>

</form>

<a th:href="@{/abonnements}">Retour à la liste</a>

</body>
</html>
