<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Liste des abonnements</title>
</head>
<body>

<h1>Liste des abonnements</h1>

<a th:href="@{/abonnements/ajouter}">Ajouter un abonnement</a>

<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>Date d'abonnement</th>
        <th>Actions</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="abonnement : ${abonnements}">
        <td th:text="${abonnement.id}"></td>
        <td th:text="${abonnement.dateAbonnement}"></td>
        <td>
            <a th:href="@{/abonnements/supprimer/{id}(id=${abonnement.id})}">
                Supprimer
            </a>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
