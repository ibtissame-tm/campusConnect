<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Liste des adhésions</title>
</head>
<body>

<h1>Liste des adhésions</h1>

<a th:href="@{/adhesions/ajouter}">Ajouter une adhésion</a>

<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>Statut</th>
        <th>Date d'adhésion</th>
        <th>Actions</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="adhesion : ${adhesions}">
        <td th:text="${adhesion.id}"></td>
        <td th:text="${adhesion.statut}"></td>
        <td th:text="${adhesion.dateAdhesion}"></td>
        <td>
            <a th:href="@{/adhesions/supprimer/{id}(id=${adhesion.id})}">
                Supprimer
            </a>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
